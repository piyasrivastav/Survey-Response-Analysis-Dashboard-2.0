<!DOCTYPE html>
<html>
<head>
  <title>Survey Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="header">
  <h2>Survey Response Analysis Dashboard</h2>
  <p>Effect of Spiritual and Cultural Communication on Youths - Varanasi</p>
</div>

<!-- CONTROLS -->
<div class="controls">

  <select id="questionSelect" class="dropdown"></select>

  <select id="collegeFilter" class="dropdown">
    <option value="All">All Colleges</option>
    <option value="Banaras Hindu University">BHU</option>
    <option value="MGKVP">MGKVP</option>
    <option value="Sampurnanad Sanskrit Vishwavidyalaya">SSU</option>
    <option value="Arya Mahila PG college">AMPG</option>
  </select>

  <!-- FIXED AGE FILTER -->
  <select id="ageFilter" class="dropdown">
    <option value="All">All Ages</option>
    <option value="18-23">18-23</option>
    <option value="24-29">24-29</option>
    <option value="30-35">30-35</option>
  </select>

  <select id="chartType" class="dropdown">
    <option value="bar">Bar Chart</option>
    <option value="line">Line Chart</option>
  </select>

  <button class="btn primary" onclick="downloadImage()">Image</button>
  <button class="btn secondary" onclick="downloadPDF()">PDF</button>

</div>

<!-- STATS -->
<div class="stats">
  <div class="stat-card">
    <span>Total Questions</span>
    <h3 id="totalQ">0</h3>
  </div>

  <div class="stat-card">
    <span>Total Responses</span>
    <h3 id="totalR">0</h3>
  </div>

  <div class="stat-card">
    <span>Age Groups</span>
    <h3 id="ageGroups">3</h3>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard">

  <div class="chart-section">
    <canvas id="chart"></canvas>
  </div>

  <div class="details-section">
    <h3>Current Question Details</h3>
    <div id="questionText"></div>
    <div id="optionsBox"></div>
  </div>

</div>

<footer class="footer">
  © Piya Srivastava
</footer>

<script src="app.js"></script>

</body>
</html>
